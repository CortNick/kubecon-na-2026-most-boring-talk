# The "shop" app the platform team runs. Two replicas, nothing fancy.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    environment: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
